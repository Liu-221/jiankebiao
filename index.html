<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>简课表</title>
<meta name="description" content="一个给一个人用的极简课程表">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="简课表">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<noscript>
  <div style="padding:48px 24px;font:16px/1.9 -apple-system,'PingFang SC',sans-serif;color:#1A1C24;text-align:center">
    <h2 style="margin:0 0 12px">这个页面需要 JavaScript</h2>
    <p style="color:#6B7080;margin:0 0 20px">课表是由脚本画出来的，所以直接预览会是一片空白。<br>请用浏览器打开，或者双击 <b>启动课表.bat</b>。</p>
  </div>
</noscript>

<header class="topbar" id="topbar"></header>

<main id="app" class="app"></main>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-act="tab" data-view="grid"><span class="ti">▦</span><span>课表</span></button>
  <button class="tab" data-act="tab" data-view="today"><span class="ti">☀</span><span>今日</span></button>
  <button class="tab" data-act="tab" data-view="log"><span class="ti">⇄</span><span>记录</span></button>
  <button class="tab" data-act="tab" data-view="settings"><span class="ti">⚙</span><span>设置</span></button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden aria-live="polite"></section>

<div class="toast" id="toast" hidden>
  <span id="toastText"></span>
  <button class="toast-btn" data-act="undo" id="undoBtn">撤销</button>
</div>

<input type="file" id="fileInput" hidden>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
